name: Test and deploy

on:
  push:
    branches: [main, claude/gym-tracker-web-app-87lzrm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The saved design versions are tags; each one is built from its own commit.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the saved design versions (Settings → Design versions)
        run: npm run build:versions
      - name: Build the online Claude connector (as Vercel builds it)
        run: npm run build:cloud
      - name: Test the built connectors (HTTP and stdio) against a local relay
        run: npm run test:built
      - name: Check the Claude Desktop extension with the official mcpb tool
        run: node scripts/validate-mcpb.mjs
      - name: End-to-end tests (iPhone sizes and desktop, against the production build)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # GitHub Pages must be on once: Settings → Pages → Source: GitHub Actions.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        # Turns Pages on if it isn't yet (where the token is allowed to); otherwise the step below says what's missing.
        continue-on-error: true
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
